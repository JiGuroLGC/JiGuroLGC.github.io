<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | JiGuro's Blog</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft Jhenghei', Lantinghei SC, 'lanting', PingFang SC, Seguo UI, Microsoft Yahei, Arial;
            background: #fff;
            color: #161209;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-theme {
            background: #292a2d;
            color: #a9a9b3;
        }
        .notfound {
            text-align: center;
            padding: 2rem;
        }
        .notfound-code {
            font-size: 8rem;
            font-weight: 100;
            line-height: 1;
            margin: 0;
            letter-spacing: 0.05em;
            color: #bbb;
            transition: color 0.3s;
        }
        body.dark-theme .notfound-code {
            color: #555;
        }
        .notfound-title {
            font-size: 1.5rem;
            font-weight: 400;
            margin: 0.5rem 0 1rem;
        }
        .notfound-desc {
            font-size: 0.95rem;
            opacity: 0.65;
            margin: 0 0 2rem;
            max-width: 320px;
            line-height: 1.8;
        }
        .notfound-home {
            display: inline-block;
            padding: 0.6rem 2rem;
            border: 1px solid #161209;
            border-radius: 4px;
            text-decoration: none;
            color: inherit;
            font-size: 0.9rem;
            transition: all 0.25s;
        }
        .notfound-home:hover {
            background: #161209;
            color: #fff;
        }
        body.dark-theme .notfound-home {
            border-color: #a9a9b3;
        }
        body.dark-theme .notfound-home:hover {
            background: #a9a9b3;
            color: #292a2d;
        }
        @media screen and (max-width: 480px) {
            .notfound-code { font-size: 5rem; }
            .notfound-title { font-size: 1.2rem; }
        }
    </style>
</head>

<body>
    <div class="notfound">
        <p class="notfound-code">404</p>
        <p class="notfound-title">Page Not Found</p>
        <p class="notfound-desc">The page you are looking for does not exist or has been moved.</p>
        <a class="notfound-home" href="/">Back to Home</a>
    </div>

    <script>
        (function () {
            var theme = window.localStorage && window.localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
            }
        })();
    </script>
</body>

</html>
