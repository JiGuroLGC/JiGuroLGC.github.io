                pagebody.classList.remove('dark-theme');
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById("mobile-toggle-theme").innerText = "· 重阳";

        })();

        <script>
            var mobileBtn = function f() {
                var toggleMenu = document.querySelector('.menu-toggle');
                var overlay = document.getElementById('mobile-overlay');
                var body = document.body;
                if (toggleMenu.classList.contains('active')) {
                    toggleMenu.classList.remove('active');
                    overlay.classList.remove('active');
                    body.classList.remove('menu-open');
                } else {
                    toggleMenu.classList.add('active');
                    overlay.classList.add('active');
                    body.classList.add('menu-open');
                }
            };

            // 点击蒙版背景关闭菜单
            document.getElementById('mobile-overlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    document.querySelector('.menu-toggle').classList.remove('active');
                    this.classList.remove('active');
                    document.body.classList.remove('menu-open');
                }
            });

            // 点击菜单项后关闭菜单
            document.querySelectorAll('.mobile-menu-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    var href = this.getAttribute('href');
                    var toggle = document.querySelector('.menu-toggle');
                    var overlay = document.getElementById('mobile-overlay');
                    toggle.classList.remove('active');
                    overlay.classList.remove('active');
                    document.body.classList.remove('menu-open');
                    setTimeout(function() {
                        window.location.href = href;
                    }, 280);
                });
            });
        </script>

        <script>
            function escHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function copyCodeBlock(btn) {
                var code = btn.closest('.code-block').querySelector('.code-content code');
                if (!code) return;
                var text = code.textContent.trim();
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(function() {
                        btn.textContent = '已复制';
                        btn.classList.add('copied');
                        setTimeout(function() {
                            btn.textContent = '复制';
                            btn.classList.remove('copied');
                        }, 1500);
                    });
                }
            }

            function copyShareLink() {
                var url = window.location.href;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url).then(function() {
                        var btn = document.getElementById('share-btn');
                        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已复制';
                        btn.classList.add('copied');
                        setTimeout(function() {
                            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> 分享文章';
                            btn.classList.remove('copied');
                        }, 2000);
                    });
                } else {
                    var ta = document.createElement('textarea');
                    ta.value = url;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    var btn = document.getElementById('share-btn');
                    btn.innerHTML = '已复制!';
                    btn.classList.add('copied');
                    setTimeout(function() {
                        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> 分享文章';
                        btn.classList.remove('copied');
                    }, 2000);
                }
            }

            (function() {
                var params = new URLSearchParams(window.location.search);
                var postId = params.get('id');
                if (!postId) {
                    document.getElementById('post-title').textContent = '文章未找到';
                    document.getElementById('post-content').innerHTML = '<p>请从归档页面选择一篇文章。</p>';
                    document.querySelector('.post-page').classList.add('is-loaded');
                    var footer = document.getElementById('footer');
                    if (footer) footer.classList.add('is-loaded');
                    return;
                }

                var postType = params.get('type') || 'post';
                var indexUrl = postType === 'poetry' ? '/poetry/index.json' : '/posts/index.json';

                // 根据类型更新返回按钮
                var backLink = document.getElementById('post-back-link');
                if (backLink) {
                    if (postType === 'poetry') {
                        backLink.href = '/poetry';
                        backLink.innerHTML = '← 返回诗文';
                    }
                }

                fetch(indexUrl)
                    .then(function(r) {
                        return r.json();
                    })
                    .then(function(articles) {
                        var article = null;
                        for (var i = 0; i < articles.length; i++) {
                            if (articles[i].id === postId) {
                                article = articles[i];
                                break;
                            }
                        }
                        if (!article) throw new Error('Article not found');

                        document.title = article.title + ' | JiGuro的个人博客';
                        document.getElementById('post-title').textContent = article.title;

                        // Author
                        document.getElementById('post-author').textContent = article.author || 'Liu Guancheng';

                        // Date
                        var date = new Date(article.date);
                        var months = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
                        document.getElementById('post-date').textContent =
                            months[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();

                        // Cover image
                        if (article.image) {
                            document.getElementById('post-cover').style.display = '';
                            var coverImg = document.getElementById('post-cover-img');
                            coverImg.src = article.image;
                            coverImg.alt = article.title;
                            function onCoverReady() {
                                if (coverImg.classList.contains('loaded')) return;
                                coverImg.classList.add('loaded');
                            }
                            if (coverImg.complete) {
                                onCoverReady();
                            } else {
                                coverImg.addEventListener('load', onCoverReady);
                                coverImg.addEventListener('error', onCoverReady);
                            }
                        }

                        // Tags
                        if (article.tags && article.tags.length) {
                            var tagsHtml = '';
                            for (var t = 0; t < article.tags.length; t++) {
                                var tag = (article.tags[t] || '').trim();
                                if (tag) tagsHtml += '<a href="/tag?tag=' + encodeURIComponent(tag) + '">' + tag + '</a>';
                            }
                        document.getElementById('post-page-tags').innerHTML = tagsHtml;
                    }

                    // Populate prev/next navigation
                    (function() {
                        var aIdx = -1;
                        for (var k = 0; k < articles.length; k++) {
                            if (articles[k].id === postId) { aIdx = k; break; }
                        }
                        if (aIdx === -1) return;
                        var prevArticle = aIdx > 0 ? articles[aIdx - 1] : null;
                        var nextArticle = aIdx < articles.length - 1 ? articles[aIdx + 1] : null;
                        if (!prevArticle && !nextArticle) return;

                        var nav = document.getElementById('post-nav');
                        nav.style.display = '';

                        if (prevArticle) {
                            var prevLink = document.getElementById('post-nav-prev');
                            prevLink.href = '?id=' + encodeURIComponent(prevArticle.id) + (postType === 'poetry' ? '&type=poetry' : '');
                            document.getElementById('post-nav-prev-title').textContent = prevArticle.title;
                        } else {
                            document.getElementById('post-nav-prev').style.visibility = 'hidden';
                        }

                        if (nextArticle) {
                            var nextLink = document.getElementById('post-nav-next');
                            nextLink.href = '?id=' + encodeURIComponent(nextArticle.id) + (postType === 'poetry' ? '&type=poetry' : '');
                            document.getElementById('post-nav-next-title').textContent = nextArticle.title;
                        } else {
                            document.getElementById('post-nav-next').style.visibility = 'hidden';
                        }
                    })();

                        return fetch(article.path);
                    })
                    .then(function(r) {
                        return r.text();
                    })
                    .then(function(md) {
                        // Detect poetry genre from first-line HTML comment (handle BOM)
                        var genre = '';
                        var cleanMd = md.replace(/^\uFEFF/, '');
                        var genreMatch = cleanMd.match(/^\s*<!--\s*(.+?)\s*-->/);
                        if (genreMatch) {
                            genre = genreMatch[1];
                            cleanMd = cleanMd.replace(/^\s*<!--\s*.+?\s*-->\s*\n?/, '');
                        }

                        // Use marked default renderer
                        document.getElementById('post-content').innerHTML = marked.parse(cleanMd);

                        // Apply poetry layout class if genre is detected
                        if (genre) {
                            var layoutMap = {
                                '现代诗': 'poetry-layout-xds',
                                '仿古诗': 'poetry-layout-fgs',
                                '仿古词': 'poetry-layout-fgc',
                                '散文': 'poetry-layout-sw'
                            };
                            var cls = layoutMap[genre];
                            if (cls) document.getElementById('post-content').classList.add(cls);

                            // 仿古词后处理：长句顶格，短句阶梯缩进
                            if (genre === '仿古词') {
                                var postContent = document.getElementById('post-content');
                                var paragraphs = postContent.querySelectorAll('p');
                                
                                // Step 1: collect all lines and find max segment length
                                var lineData = [];  // { paraIndex, lineIndex, maxSegLen }
                                var overallMax = 0;
                                
                                for (var i = 0; i < paragraphs.length; i++) {
                                    var html = paragraphs[i].innerHTML;
                                    var lines = html.split(/<br\s*\/?\s*>/i);
                                    for (var j = 0; j < lines.length; j++) {
                                        var text = lines[j].replace(/<[^>]+>/g, '');
                                        var segments = text.split(/[，\uFF0C]/);
                                        var segMax = 0;
                                        for (var k = 0; k < segments.length; k++) {
                                            var seg = segments[k].replace(/[。！？、；：""''（）《》【】\.,;:!?\s\u3000]/g, '');
                                            if (seg.length > segMax) segMax = seg.length;
                                        }
                                        lineData.push({ p: i, idx: j, maxSeg: segMax, html: lines[j] });
                                        if (segMax > overallMax) overallMax = segMax;
                                    }
                                }
                                
                                // Step 2: determine short threshold
                                var shortThreshold = Math.ceil(overallMax / 2);
                                
                                // Step 3: rebuild paragraphs with short-line spans
                                for (var i = 0; i < lineData.length; i++) {
                                    if (lineData[i].maxSeg < shortThreshold) {
                                        lineData[i].html = '<span class="ci-short">' + lineData[i].html + '</span>';
                                    }
                                }
                                
                                // Step 4: group by paragraph and write back
                                var paraLines = {};
                                for (var i = 0; i < lineData.length; i++) {
                                    var pi = lineData[i].p;
                                    if (!paraLines[pi]) paraLines[pi] = [];
                                    paraLines[pi].push(lineData[i].html);
                                }
                                for (var pi in paraLines) {
                                    if (paraLines.hasOwnProperty(pi)) {
                                        paragraphs[pi].innerHTML = paraLines[pi].join('<br>');
                                    }
                                }
                            }
                        }

                        // Enhance code blocks
                        var pres = document.querySelectorAll('.post-page-content pre');
                        for (var p = 0; p < pres.length; p++) {
                            var pre = pres[p];
                            var codeEl = pre.querySelector('code');
                            var codeText = codeEl ? codeEl.textContent : pre.textContent;
                            var lang = '';
                            if (codeEl) {
                                var cls = codeEl.className || '';
                                var m = cls.match(/language-(\w+)/);
                                if (m) lang = m[1];
                            }

                            // Build line numbers
                            var lines = codeText.split('\n');
                            if (lines.length && lines[lines.length - 1] === '') lines.pop();
                            var nums = '';
                            for (var n = 1; n <= lines.length; n++) nums += '<span>' + n + '</span>';

                            // Build new HTML
                            var langHtml = lang ? '<span class="code-lang">' + lang + '</span>' : '';
                            var isTxt = lang.toUpperCase() === 'TXT';
                            var codeClass = '';
                            if (lang && !isTxt) {
                                codeClass = ' class="language-' + lang + '"';
                            } else if (isTxt) {
                                codeClass = ' class="nohighlight"';
                            }
                            var newHtml =
                                '<pre class="code-block">' +
                                '<div class="code-header">' +
                                langHtml +
                                '<button class="code-copy-btn" onclick="copyCodeBlock(this)">复制</button>' +
                                '</div>' +
                                '<div class="code-body">' +
                                '<div class="code-lines">' + nums + '</div>' +
                                '<div class="code-content"><code' + codeClass + '>' + escHtml(codeText) + '</code></div>' +
                                '</div>' +
                                '</pre>';

                            // Replace
                            var temp = document.createElement('div');
                            temp.innerHTML = newHtml;
                            pre.parentNode.replaceChild(temp.firstChild, pre);
                        }

                        // Apply syntax highlighting
                        document.querySelectorAll('.post-page-content .code-content code').forEach(function(code) {
                            hljs.highlightElement(code);
                        });

                        // Wrap images in placeholder containers for progressive loading
                        // Same mechanism as archive cards: complete → immediate; else → listeners
                        (function() {
                            var vw = window.innerWidth;
                            var contentImgs = document.querySelectorAll('.post-page-content img');
                            contentImgs.forEach(function(img) {
                                if (img.closest('.code-block') || img.closest('.img-placeholder')) return;

                                if (img.hasAttribute('width')) img.style.width = img.getAttribute('width') + 'px';
                                if (img.hasAttribute('height')) img.style.height = img.getAttribute('height') + 'px';

                                var parentA = img.parentElement;
                                var isBadge = parentA && parentA.tagName === 'A';
                                var hasExplicitSize = img.hasAttribute('width') || img.hasAttribute('height');
                                var wrap = document.createElement('div');
                                wrap.className = 'img-placeholder' + (isBadge || hasExplicitSize ? ' badge-img' : '');
                                wrap.style.transition = 'background-color 0.5s ease';
                                if (isBadge) {
                                    wrap.style.borderRadius = '0';
                                }
                                parentA ? parentA.insertBefore(wrap, img) : img.parentNode.insertBefore(wrap, img);
                                wrap.appendChild(img);

                                // Overflow detection after load
                                function onImgReady() {
                                    if (img.classList.contains('loaded')) return;
                                    img.classList.add('loaded');
                                        wrap.style.backgroundColor = 'transparent';
                                    if (!isBadge) {
                                        var w = img.naturalWidth || img.clientWidth || 0;
                                        if (w > vw - 40) {
                                            img.style.maxWidth = '100%';
                                            img.style.height = 'auto';
                                        }
                                    }
                                }
                                if (img.complete) {
                                    onImgReady();
                                } else {
                                    img.addEventListener('load', onImgReady);
                                    img.addEventListener('error', onImgReady);
                                }
                            });
                        })();

                        // Convert Obsidian-style callouts
                        (function() {
                            var bqs = document.querySelectorAll('.post-page-content blockquote');
                            for (var b = 0; b < bqs.length; b++) {
                                var bq = bqs[b];
                                var firstP = bq.querySelector('p');
                                if (!firstP) continue;
                                var text = firstP.textContent || '';
                                var m2 = text.match(/^\[!(\w+)\]\s*(.*)/);
                                if (!m2) continue;
                                var type = m2[1].toLowerCase();
                                var title = m2[2] || type.charAt(0).toUpperCase() + type.slice(1);

                                // Build Obsidian callout HTML structure
                                bq.setAttribute('data-callout', type);
                                bq.classList.add('callout');
                                bq.innerHTML =
                                    '<div class="callout-title">' +
                                    '<div class="callout-icon"></div>' +
                                    '<div class="callout-title-inner">' + title + '</div>' +
                                    '</div>' +
                                    '<div class="callout-content">' + (firstP.innerHTML.replace(/^\[!\w+\]\s*/, '') || '') +
                                    Array.prototype.slice.call(bq.querySelectorAll('p'), 1).map(function(p) {
                                        return p.outerHTML;
                                    }).join('') + '</div>';
                            }
                        })();

                        // Scroll-reveal animation for header elements
                        var headerEls = [
                            document.getElementById('post-cover'),
                            document.getElementById('post-title'),
                            document.querySelector('.post-page-meta'),
                            document.getElementById('post-page-tags')
                        ];
                        for (var h = 0; h < headerEls.length; h++) {
                            if (headerEls[h]) {
                                (function(el, idx) {
                                    setTimeout(function() {
                                        el.classList.add('is-revealed');
                                    }, idx * 80);
                                })(headerEls[h], h);
                            }
                        }

                        // Scroll-reveal animation for content children (delayed after header)
                        (function() {
                            var container = document.getElementById('post-content');
                            if (!container) return;

                            setTimeout(function() {
                                var children = container.children;
                                if (!children.length) return;

                                // Fallback: IntersectionObserver not supported
                                if (!('IntersectionObserver' in window)) {
                                    for (var i = 0; i < children.length; i++) {
                                        children[i].classList.add('is-revealed');
                                    }
                                    return;
                                }

                                var observer = new IntersectionObserver(function(entries) {
                                    for (var e = 0; e < entries.length; e++) {
                                        if (entries[e].isIntersecting) {
                                            entries[e].target.classList.add('is-revealed');
                                            observer.unobserve(entries[e].target);
                                        }
                                    }
                                }, {
                                    threshold: 0.15
                                });

                                for (var c = 0; c < children.length; c++) {
                                    observer.observe(children[c]);
                                }
                            }, 400);
                        })();
                    })
                    .then(function() {
                        document.querySelector('.post-page').classList.add('is-loaded');
                        var footer = document.getElementById('footer');
                        if (footer) footer.classList.add('is-loaded');
                    })
                    .catch(function(err) {
                        document.getElementById('post-title').textContent = '加载失败';
                        document.getElementById('post-content').innerHTML = '<p>无法加载文章内容。</p>';
                        document.querySelector('.post-page').classList.add('is-loaded');
                        var footer = document.getElementById('footer');
                        if (footer) footer.classList.add('is-loaded');
                    });
            })();
        </script>

        <button id="back-to-top" title="回到顶部">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="18 15 12 9 6 15" />
            </svg>
        </button>

        <script>
            (function() {
                var btn = document.getElementById('back-to-top');
                if (!btn) return;
                var lastY = 0;
                var ticking = false;

                btn.addEventListener('click', function() {
                    btn.classList.remove('visible');
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                });

                window.addEventListener('scroll', function() {
                    if (!ticking) {
                        requestAnimationFrame(function() {
                            var y = window.scrollY;
                            var maxY = document.documentElement.scrollHeight - window.innerHeight - 20;
                            if (y <= 100 || y >= maxY) {
                                btn.classList.remove('visible');
                            } else if (y > lastY + 20) {
                                btn.classList.add('visible');
                            } else if (y < lastY - 20) {
                                btn.classList.remove('visible');
                            }
                            lastY = y;
                            ticking = false;
                        });
                        ticking = true;
                    }
                }, {
                    passive: true
                });
            })();

            /* Code content scrollbar show/hide */
            (function() {
                var hideTimer = 0;

                // Capture scroll events on .code-content elements
                document.addEventListener('scroll', function(e) {
                    var content = e.target.closest ? e.target.closest('.code-content') : null;
                    if (!content) return;

                    clearTimeout(hideTimer);

                    // Show scrollbar on the scrolled code content
                    document.querySelectorAll('.code-content.show-scrollbar').forEach(function(c) {
                        if (c !== content) c.classList.remove('show-scrollbar');
                    });
                    content.classList.add('show-scrollbar');

                    // Auto-hide after 1.5s of no horizontal scroll
                    hideTimer = setTimeout(function() {
                        content.classList.remove('show-scrollbar');
                    }, 1500);
                }, {
                    capture: true,
                    passive: true
                });

                // Page vertical scroll: hide all code scrollbars
                window.addEventListener('scroll', function() {
                    document.querySelectorAll('.code-content.show-scrollbar').forEach(function(c) {
                        c.classList.remove('show-scrollbar');
                    });
                    clearTimeout(hideTimer);
                }, {
                    passive: true
                });
            })();
        </script>
