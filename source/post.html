        // Smali language definition for highlight.js
        if (typeof hljs !== 'undefined') {
            hljs.registerLanguage('smali', function(e) {
            return {
                c: [
                    { cN: 'comment', b: '#', e: /$/ },
                    { cN: 'string',  b: /"/, e: /"/, c: [e.BACKSLASH_ESCAPE] },
                    { cN: 'meta',    b: /\\.(class|super|implements|method|end|field|source|annotation|subannotation|prologue|locals|registers|param|line|restart|local|array|enum|catch|catchall|packed-switch|sparse-switch|array-data|epilogue|synthetic|override|runtime|signature|system|enclosing|inner)/, r: 10 },
                    { cN: 'keyword', b: /\b(public|private|protected|static|final|abstract|synthetic|constructor|native|strictfp|synchronized|transient|volatile|bridge|varargs|enum|declared-synchronized)\b/ },
                    { cN: 'title.function_', b: /\b(move|return|const|monitor|check-cast|instance-of|new-instance|throw|goto|packed-switch|sparse-switch|if|aget|aput|iget|iput|sget|sput|invoke|cmp|neg|not|int-to|long-to|float-to|double-to|byte-to|char-to|short-to|add|sub|mul|div|rem|and|or|xor|shl|shr|ushr|rsub|fill-array-data|filled-new-array|move-result|move-exception|return-void|nop|array-length|fill-array|execute-inline)(-[a-zA-Z_]+)?(\/[a-zA-Z_]+)?\b/ },
                    { cN: 'type',    b: /L[a-zA-Z0-9/$_.\-]+;|[VZBSCIJFD](?![\w])/ },
                    { cN: 'built_in', b: /[vp]\d+/, r: 0 },
                    { cN: 'symbol',  b: /^:\w[a-zA-Z0-9_]*/, r: 5 },
                    { cN: 'number',  b: /0x[a-fA-F0-9]+|-?\d+(\.\d+)?[fd]?\b/ }
                ]
            };
        });
        }
    </script>

            const pagebody = document.getElementsByTagName('body')[0]

                document.documentElement.setAttribute('data-theme', 'light');

        })();

        <script>
            var mobileBtn = function f() {
                var toggleMenu = document.querySelector('.menu-toggle');
                var overlay = document.getElementById('mobile-overlay');
                var body = document.body;
                if (toggleMenu.classList.contains('active')) {
                    toggleMenu.classList.remove('active');
                    overlay.classList.remove('active');
                    body.classList.remove('menu-open');
                } else {
                    toggleMenu.classList.add('active');
                    overlay.classList.add('active');
                    body.classList.add('menu-open');
                }
            };

            // 点击蒙版背景关闭菜单
            document.getElementById('mobile-overlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    document.querySelector('.menu-toggle').classList.remove('active');
                    this.classList.remove('active');
                    document.body.classList.remove('menu-open');
                }
            });

            // 点击菜单项后关闭菜单
            document.querySelectorAll('.mobile-menu-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    var href = this.getAttribute('href');
                    var toggle = document.querySelector('.menu-toggle');
                    var overlay = document.getElementById('mobile-overlay');
                    toggle.classList.remove('active');
                    overlay.classList.remove('active');
                    document.body.classList.remove('menu-open');
                    setTimeout(function() {
                        window.location.href = href;
                    }, 280);
                });
            });
        </script>

        <script>
            function escHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function copyCodeBlock(btn) {
                var code = btn.closest('.code-block').querySelector('.code-content code');
                if (!code) return;
                var text = code.textContent.trim();
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(function() {
                        btn.textContent = '已复制';
                        btn.classList.add('copied');
                        setTimeout(function() {
                            btn.textContent = '复制';
                            btn.classList.remove('copied');
                        }, 1500);
                    });
                }
            }

            function copyShareLink() {
                var url = window.location.href;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url).then(function() {
                        var btn = document.getElementById('share-btn');
                        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已复制';
                        btn.classList.add('copied');
                        setTimeout(function() {
                            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> 分享文章';
                            btn.classList.remove('copied');
                        }, 2000);
                    });
                } else {
                    var ta = document.createElement('textarea');
                    ta.value = url;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    var btn = document.getElementById('share-btn');
                    btn.innerHTML = '已复制!';
                    btn.classList.add('copied');
                    setTimeout(function() {
                        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> 分享文章';
                        btn.classList.remove('copied');
                    }, 2000);
                }
            }

            (function() {
                var params = new URLSearchParams(window.location.search);
                var postId = params.get('id');
                if (!postId) {
                    document.getElementById('post-title').textContent = '文章未找到';
                    document.getElementById('post-content').innerHTML = '<p>请从归档页面选择一篇文章。</p>';
                    document.querySelector('.post-page').classList.add('is-loaded');
                    var footer = document.getElementById('footer');
                    if (footer) footer.classList.add('is-loaded');
                    return;
                }

                var postType = params.get('type') || 'post';
                var indexUrl = postType === 'poetry' ? '/poetry/index.json' : '/posts/index.json';

                // 根据类型更新返回按钮
                var backLink = document.getElementById('post-back-link');
                if (backLink) {
                    if (postType === 'poetry') {
                        backLink.href = '/poetry';
                        backLink.innerHTML = '← 返回诗文';
                    }
                }

                var article;
                fetch(indexUrl)
                    .then(function(r) {
                        return r.json();
                    })
                    .then(function(articles) {
                        article = null;
                        for (var i = 0; i < articles.length; i++) {
                            if (articles[i].id === postId) {
                                article = articles[i];
                                break;
                            }
                        }
                        if (!article) throw new Error('Article not found');

                        document.title = article.title + ' | JiGuro的个人博客';
                        document.getElementById('post-title').textContent = article.title;

                        // Author
                        document.getElementById('post-author').textContent = article.author || 'Liu Guancheng';

                        // Date
                        var date = new Date(article.date);
                        var months = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
                        document.getElementById('post-date').textContent =
                            months[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();

                        // Cover image
                        if (article.image) {
                            document.getElementById('post-cover').style.display = '';
                            var coverImg = document.getElementById('post-cover-img');
                            coverImg.src = article.image;
                            coverImg.alt = article.title;

                            function onCoverReady() {
                                if (coverImg.classList.contains('loaded')) return;
                                coverImg.classList.add('loaded');
                            }
                            if (coverImg.complete) {
                                onCoverReady();
                            } else {
                                coverImg.addEventListener('load', onCoverReady);
                                coverImg.addEventListener('error', onCoverReady);
                            }
                        }

                        // Tags
                        if (article.tags && article.tags.length) {
                            var tagsHtml = '';
                            for (var t = 0; t < article.tags.length; t++) {
                                var tag = (article.tags[t] || '').trim();
                                if (tag) tagsHtml += '<a href="/tag?tag=' + encodeURIComponent(tag) + '">' + tag + '</a>';
                            }
                            document.getElementById('post-page-tags').innerHTML = tagsHtml;
                        }

                        // Populate prev/next navigation
                        (function() {
                            var aIdx = -1;
                            for (var k = 0; k < articles.length; k++) {
                                if (articles[k].id === postId) {
                                    aIdx = k;
                                    break;
                                }
                            }
                            if (aIdx === -1) return;
                            var prevArticle = aIdx > 0 ? articles[aIdx - 1] : null;
                            var nextArticle = aIdx < articles.length - 1 ? articles[aIdx + 1] : null;
                            if (!prevArticle && !nextArticle) return;

                            var nav = document.getElementById('post-nav');
                            nav.style.display = '';

                            if (prevArticle) {
                                var prevLink = document.getElementById('post-nav-prev');
                                prevLink.href = '?id=' + encodeURIComponent(prevArticle.id) + (postType === 'poetry' ? '&type=poetry' : '');
                                document.getElementById('post-nav-prev-title').textContent = prevArticle.title;
                            } else {
                                document.getElementById('post-nav-prev').style.visibility = 'hidden';
                            }

                            if (nextArticle) {
                                var nextLink = document.getElementById('post-nav-next');
                                nextLink.href = '?id=' + encodeURIComponent(nextArticle.id) + (postType === 'poetry' ? '&type=poetry' : '');
                                document.getElementById('post-nav-next-title').textContent = nextArticle.title;
                            } else {
                                document.getElementById('post-nav-next').style.visibility = 'hidden';
                            }
                        })();

                        return fetch(article.path);
                    })
                    .then(function(r) {
                        return r.text();
                    })
                    .then(function(md) {
                        // Detect poetry genre from first-line HTML comment (handle BOM)
                        var genre = '';
                        var cleanMd = md.replace(/^\uFEFF/, '');
                        var genreMatch = cleanMd.match(/^\s*<!--\s*(.+?)\s*-->/);
                        if (genreMatch) {
                            genre = genreMatch[1];
                            cleanMd = cleanMd.replace(/^\s*<!--\s*.+?\s*-->\s*\n?/, '');
                        }

                        // Extract 尾注 section
                        var endnote = '';
                        var endnoteMatch = cleanMd.match(/<!-- 尾注 -->\s*([\s\S]*?)\s*<!-- \/尾注 -->/);
                        if (endnoteMatch) {
                            endnote = endnoteMatch[1].trim();
                            cleanMd = cleanMd.replace(/<!-- 尾注 -->[\s\S]*?<!-- \/尾注 -->\s*/g, '');
                        }

                        // Extract 注释 section
                        var annotations = [];
                        var titleAnnotations = [];
                        var annotMatch = cleanMd.match(/<!-- 注释 -->\s*([\s\S]*?)\s*<!-- \/注释 -->/);
                        if (annotMatch) {
                            var annotText = annotMatch[1].trim();
                            var annotLines = annotText.split('\n');
                            for (var al = 0; al < annotLines.length; al++) {
                                var line = annotLines[al];
                                var isTitle = false;
                                // Check for [N_T] title annotation format first
                                var tm = line.match(/\[(\d+)_T\]\s*(.*)/);
                                if (tm) {
                                    isTitle = true;
                                    annotations.push({ num: parseInt(tm[1], 10), text: tm[2].trim() });
                                    titleAnnotations.push(parseInt(tm[1], 10));
                                } else {
                                    // Regular [N] annotation
                                    var m = line.match(/\[(\d+)\]\s*(.*)/);
                                    if (m) {
                                        annotations.push({ num: parseInt(m[1], 10), text: m[2].trim() });
                                    }
                                }
                            }
                            cleanMd = cleanMd.replace(/<!-- 注释 -->[\s\S]*?<!-- \/注释 -->\s*/g, '');
                        }

                        // Extract 心语 section
                        var xinyu = '';
                        var xinyuMatch = cleanMd.match(/<!-- 心语 -->\s*([\s\S]*?)\s*<!-- \/心语 -->/);
                        if (xinyuMatch) {
                            xinyu = xinyuMatch[1].trim();
                            cleanMd = cleanMd.replace(/<!-- 心语 -->[\s\S]*?<!-- \/心语 -->\s*/g, '');
                        }

                        // Build set of defined annotation numbers
                        var definedNums = {};
                        for (var d = 0; d < annotations.length; d++) {
                            definedNums[annotations[d].num] = true;
                        }

                        // Replace annotation references in body text (only defined numbers)
                        cleanMd = cleanMd.replace(/\[(\d+)\]/g, function(match, num) {
                            if (definedNums[parseInt(num, 10)]) {
                                return '<sup class="annotation-ref" id="annot-ref-' + num + '"><a href="#annot-' + num + '">[' + num + ']</a></sup>';
                            }
                            return match;
                        });

                        // Use marked default renderer
                        var postHtml = marked.parse(cleanMd);

                        // Append 尾注
                        if (endnote) {
                            var lines = endnote.split('\n');
                            var endnoteHtml = '<div class="poetry-endnote">';
                            for (var el = 0; el < lines.length; el++) {
                                var line = lines[el].trim();
                                if (line) endnoteHtml += '<p>' + escHtml(line) + '</p>';
                            }
                            endnoteHtml += '</div>';
                            postHtml += endnoteHtml;
                        }

                        // Append 注释
                        if (annotations.length > 0) {
                            var annotHtml = '<div class="poetry-annotations"><h4 class="poetry-section-title">注释</h4><ol class="poetry-annotations-list">';
                            for (var an = 0; an < annotations.length; an++) {
                                var a = annotations[an];
                                var rendered = marked.parse(a.text);
                                // Strip wrapping <p> tags so it renders inline
                                rendered = rendered.replace(/^<p>/, '').replace(/<\/p>\s*$/, '');
                                annotHtml += '<li id="annot-' + a.num + '" value="' + a.num + '"><span class="annot-marker">[' + a.num + ']</span> ' + rendered + ' <a class="annot-back-link" href="#annot-ref-' + a.num + '" title="回到文中">&uarr;</a></li>';
                            }
                            annotHtml += '</ol></div>';
                            postHtml += annotHtml;
                        }

                        // Append 心语 (render through marked for markdown support)
                        if (xinyu) {
                            var xinyuContent = marked.parse(xinyu);
                            var xinyuHtml = '<div class="poetry-xinyu"><h4 class="poetry-section-title">心语</h4><div class="poetry-xinyu-content">' + xinyuContent + '</div></div>';
                            postHtml += xinyuHtml;
                        }

                        document.getElementById('post-content').innerHTML = postHtml;

                        // Append title annotation superscripts to page title
                        if (titleAnnotations.length > 0) {
                            var titleEl = document.getElementById('post-title');
                            if (titleEl) {
                                var titleSupHtml = '';
                                for (var tn = 0; tn < titleAnnotations.length; tn++) {
                                    var tnum = titleAnnotations[tn];
                                    titleSupHtml += '<sup class="annotation-ref" id="annot-ref-' + tnum + '"><a href="#annot-' + tnum + '">[' + tnum + ']</a></sup>';
                                }
                                titleEl.innerHTML = titleEl.textContent + titleSupHtml;
                            }
                        }

                        // Apply poetry layout class if genre is detected
                        if (genre) {
                            var layoutMap = {
                                '现代诗': 'poetry-layout-xds',
                                '仿古诗': 'poetry-layout-fgs',
                                '仿古词': 'poetry-layout-fgc',
                                '散文': 'poetry-layout-sw'
                            };
                            var cls = layoutMap[genre];
                            if (cls) document.getElementById('post-content').classList.add(cls);

                            // 仿古词后处理：长句顶格，短句阶梯缩进
                            if (genre === '仿古词') {
                                var postContent = document.getElementById('post-content');

                                } else if (img.hasAttribute('width') && img.hasAttribute('height')) {
                                    var w = parseInt(img.getAttribute('width'), 10);

                                // Progressive loading with ratio correction

                                    if (img.classList.contains('loaded')) return;

                                    var naturalW = img.naturalWidth;
                                    var naturalH = img.naturalHeight;

                                    if (naturalW && naturalH) {
                                        var containerWidth = a.parentElement.clientWidth;
                                        if (containerWidth) {
                                            // Height if image fills the full container width
                                            var naturalHeight = Math.round(containerWidth * naturalH / naturalW);

                                            // Desktop: constrain to 80vh so portrait images don't exceed viewport
                                            var maxHeight = window.innerWidth >= 1024
                                                ? Math.round(window.innerHeight * 0.8)
                                                : Infinity;

                                            var targetHeight, targetWidth;
                                            if (naturalHeight > maxHeight) {

                                                targetHeight = maxHeight;
                                                targetWidth = Math.round(maxHeight * naturalW / naturalH);
                                            } else {
                                                targetHeight = naturalHeight;
                                                targetWidth = containerWidth;

                                            var currentWidth = a.offsetWidth;
                                            var needHeightFix = Math.abs(currentHeight - targetHeight) > 6;
                                            var needWidthFix = Math.abs(currentWidth - targetWidth) > 6;

                                                    a.style.minHeight = '';
                                                    if (targetWidth < containerWidth) {

                                var prefixLen = m2[0].length; // Length of "[!TYPE] title" in plain text

                                var allFig = true;

                                    flashTarget(href.slice(1));
                                }

                                if (href && /^#annot-ref-\d+$/.test(href)) {
                                    e.preventDefault();
                                    flashTarget(href.slice(1));
                                }
                            });
                        })();
                    })
                    .then(function() {
                        document.querySelector('.post-page').classList.add('is-loaded');
                        var footer = document.getElementById('footer');
                        if (footer) footer.classList.add('is-loaded');
                    })
                    .catch(function(err) {
                        document.getElementById('post-title').textContent = '加载失败';
                        document.getElementById('post-content').innerHTML = '<p>无法加载文章内容。</p>';
                        document.querySelector('.post-page').classList.add('is-loaded');
                        var footer = document.getElementById('footer');
                        if (footer) footer.classList.add('is-loaded');
                    });
            })();
        </script>

        <button id="back-to-top" title="回到顶部">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="18 15 12 9 6 15" />
            </svg>
        </button>

        <script>
            (function() {
                var btn = document.getElementById('back-to-top');
                if (!btn) return;
                var lastY = 0;
                var ticking = false;

                btn.addEventListener('click', function() {
                    btn.classList.remove('visible');
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                });

                window.addEventListener('scroll', function() {
                    if (!ticking) {
                        requestAnimationFrame(function() {
                            var y = window.scrollY;
                            var maxY = document.documentElement.scrollHeight - window.innerHeight - 20;
                            if (y <= 100 || y >= maxY) {
                                btn.classList.remove('visible');
                            } else if (y > lastY + 20) {
                                btn.classList.add('visible');
                            } else if (y < lastY - 20) {
                                btn.classList.remove('visible');
                            }
                            lastY = y;
                            ticking = false;
                        });
                        ticking = true;
                    }
                }, {
                    passive: true
                });
            })();

            /* Code content scrollbar show/hide */
            (function() {
                var hideTimer = 0;

                // Capture scroll events on .code-content elements
                document.addEventListener('scroll', function(e) {
                    var content = e.target.closest ? e.target.closest('.code-content') : null;
                    if (!content) return;

                    clearTimeout(hideTimer);

                    // Show scrollbar on the scrolled code content
                    document.querySelectorAll('.code-content.show-scrollbar').forEach(function(c) {
                        if (c !== content) c.classList.remove('show-scrollbar');
                    });
                    content.classList.add('show-scrollbar');

                    // Auto-hide after 1.5s of no horizontal scroll
                    hideTimer = setTimeout(function() {
                        content.classList.remove('show-scrollbar');
                    }, 1500);
                }, {
                    capture: true,
                    passive: true
                });

                // Page vertical scroll: hide all code scrollbars
                window.addEventListener('scroll', function() {
                    document.querySelectorAll('.code-content.show-scrollbar').forEach(function(c) {
                        c.classList.remove('show-scrollbar');
                    });
                    clearTimeout(hideTimer);
                }, {
                    passive: true
                });
            })();
        </script>
