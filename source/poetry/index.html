			    var toggleMenu = document.querySelector('.menu-toggle');

			document.getElementById('mobile-overlay').addEventListener('click', function(e) {

			        document.querySelector('.menu-toggle').classList.remove('active');
			        this.classList.remove('active');

	<script>
		(function() {
		    var container = document.getElementById('poetry-cards-container');
		    var searchInput = document.getElementById('search-input');
		    var allPoems = [];
		    var skipAnimation = !!(window.sessionStorage && sessionStorage.getItem('_poetry_visited'));
		    var restoreScroll = window.sessionStorage && sessionStorage.getItem('_poetry_scrollY');

		    container.addEventListener('click', function(e) {
		        var link = e.target.closest('.poetry-card-link');
		        if (link && window.sessionStorage) {
		            sessionStorage.setItem('_poetry_scrollY', window.scrollY);
		        }
		    });

		    function renderCards() {
		        if (!allPoems.length) {
		            container.innerHTML = '<p style="text-align:center;opacity:0.5;">没有匹配的诗文。</p>';
		            return;
		        }

		        var months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
		        var html = '<div class="poetry-cards">';

		        for (var i = 0; i < allPoems.length; i++) {
		            var p = allPoems[i];
		            var date = new Date(p.date);
		            var monthStr = months[date.getMonth()];
		            var dayStr = date.getDate();
		            var year = date.getFullYear();
		            var preview = p.preview || '';

		            html += '<article class="poetry-card">';
		            html += '<a class="poetry-card-link" href="/post.html?id=' + p.id + '&type=poetry">';
		            html += '<div class="poetry-card-body">';
		            html += '<h3 class="poetry-card-title">' + escHtml(p.title) + '</h3>';
		            html += '<p class="poetry-card-meta">';
		            html += '<span>' + escHtml(p.author || 'JiGuro') + '</span>';
		            html += '<span>' + monthStr + ' ' + dayStr + ', ' + year + '</span>';
		            html += '</p>';
		            if (preview) {
		                html += '<p class="poetry-card-preview">' + preview + '</p>';
		                html += '<span class="poetry-card-ellipsis">...</span>';
		            }
		            html += '</div></a></article>';
		        }
		        html += '</div>';
		        container.innerHTML = html;

		        var cards = container.querySelectorAll('.poetry-card');

		        if (skipAnimation || !('IntersectionObserver' in window)) {
		            for (var c = 0; c < cards.length; c++) {
		                cards[c].classList.add('visible');
		            }
		            return;
		        }

		        var cardObserver = new IntersectionObserver(function(entries) {
		            for (var e = 0; e < entries.length; e++) {
		                if (entries[e].isIntersecting) {
		                    entries[e].target.classList.add('visible');
		                    cardObserver.unobserve(entries[e].target);
		                }
		            }
		        }, { threshold: 0.1 });

		        for (var c = 0; c < cards.length; c++) {
		            cardObserver.observe(cards[c]);
		        }
		    }

		    function filterPoems() {
		        if (window.sessionStorage) {
		            sessionStorage.removeItem('_poetry_scrollY');
		        }
		        var query = searchInput.value.trim().toLowerCase();
		        if (!query) {
		            renderCards();
		            return;
		        }
		        var filtered = [];
		        for (var i = 0; i < allPoems.length; i++) {
		            var p = allPoems[i];
		            var text = (p.title + ' ' + (p.preview || '')).toLowerCase();
		            if (text.indexOf(query) !== -1) {
		                filtered.push(p);
		            }
		        }
		        allPoems = filtered;
		        renderCards();
		        fetch('/poetry/index.json')
		            .then(function(r) { return r.json(); })
		            .then(function(full) { allPoems = full; });
		    }

		    function escHtml(s) {
		        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		    }

		    // Load index and render
		    fetch('/poetry/index.json')
		        .then(function(r) {
		            if (!r.ok) throw new Error('Index not found');
		            return r.json();
		        })
		        .then(function(poems) {
		            allPoems = poems;
		            allPoems.sort(function(a, b) {
		                return new Date(b.date) - new Date(a.date);
		            });

		            renderCards();

		            if (window.sessionStorage) {
		                sessionStorage.setItem('_poetry_visited', '1');
		            }

		            if (restoreScroll) {
		                var targetY = parseInt(restoreScroll, 10);
		                requestAnimationFrame(function() {
		                    window.scrollTo({ top: targetY, behavior: 'instant' });
		                });
		            }

		            searchInput.addEventListener('input', filterPoems);
		        })
		        .catch(function() {
		            container.innerHTML = '<p style="text-align:center;opacity:0.5;">加载诗文列表失败。</p>';
		        });
		})();
	</script>
