    <script>
        (() => {
            const currentTheme = window.localStorage && window.localStorage.getItem('theme') || '';
            const isDark = currentTheme === 'dark';
            const pagebody = document.getElementsByTagName('body')[0]
            if (isDark) {
                pagebody.classList.add('dark-theme');
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById("mobile-toggle-theme").innerText = "· 九阴"
            } else {
                pagebody.classList.remove('dark-theme');
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById("mobile-toggle-theme").innerText = "· 重阳"
            }
        })();
    </script>

    <div class="wrapper">

            <nav class="navbar">

                            <a href="/" onclick="sessionStorage&amp;&amp;sessionStorage.setItem('_home_skip','1')">JiGuro&#39;s Blog&nbsp;</a><a id="mobile-toggle-theme">·&nbsp;重阳</a>
                        </div>
                        <div class="menu-toggle" onclick="mobileBtn()">&#9776; 标签</div>

                    <div class="menu" id="mobile-menu">
                        <a class="menu-item" href="/archives">归档</a>

        <script>
            var mobileBtn = function f() {
                var toggleMenu = document.getElementsByClassName("menu-toggle")[0];
                var mobileMenu = document.getElementById("mobile-menu");
                if (toggleMenu.classList.contains("active")) {
                    toggleMenu.classList.remove("active")
                    mobileMenu.classList.remove("active")
                } else {
                    toggleMenu.classList.add("active")
                    mobileMenu.classList.add("active")
                }
            }
        </script>

        <div class="main">
            <div id="tag-container" class="container" style="max-width:900px;margin:0 auto;">
                <p style="text-align:center;opacity:0.5;">加载中...</p>
            </div>
        </div>

            </div>
            <a href="https://icp.gov.moe/?keyword=20261961" target="_blank">萌ICP备20261961号</a>
        </footer>
    </div>

    <script>
        (function() {
            var container = document.getElementById('tag-container');
            var skipAnimation = !!(window.sessionStorage && sessionStorage.getItem('_tag_visited'));
            var restoreScroll = window.sessionStorage && sessionStorage.getItem('_tag_scrollY');
            var restoreOpen = window.sessionStorage && sessionStorage.getItem('_tag_open');

            // Save state before navigating to an article
            container.addEventListener('click', function(e) {
                var link = e.target.closest('.sec-card');
                if (link && window.sessionStorage) {
                    sessionStorage.setItem('_tag_scrollY', window.scrollY);
                    // Collect open group names
                    var openNames = [];
                    var openGroups = container.querySelectorAll('.sec-group.open');
                    for (var i = 0; i < openGroups.length; i++) {
                        var titleEl = openGroups[i].querySelector('.sec-title');
                        if (titleEl) openNames.push(titleEl.textContent);
                    }
                    sessionStorage.setItem('_tag_open', openNames.join('\n'));
                }
            });

            fetch('/posts/index.json')
                .then(function(r) { return r.json(); })
                .then(function(articles) {
                    if (!articles.length) {
                        container.innerHTML = '<p style="text-align:center;opacity:0.5;">暂无文章。</p>';
                        return;
                    }

                    // Group by tag
                    var tags = {};
                    for (var i = 0; i < articles.length; i++) {
                        var articleTags = articles[i].tags || [];
                        for (var t = 0; t < articleTags.length; t++) {
                            var tag = articleTags[t];
                            if (!tags[tag]) tags[tag] = [];
                            tags[tag].push(articles[i]);
                        }
                    }

                    var months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
                    var html = '';

                    var keys = Object.keys(tags).sort();
                    for (var k = 0; k < keys.length; k++) {
                        var tag = keys[k];
                        var items = tags[tag];

                        html += '<div class="sec-group">';
                        html += '<div class="sec-header" onclick="this.parentElement.classList.toggle(\'open\')">';
                        html += '<span class="sec-arrow">▸</span>';
                        html += '<span class="sec-title">' + tag + '</span>';
                        html += '<span class="sec-count">' + items.length + '</span>';
                        html += '</div>';
                        html += '<div class="sec-body">';

                        for (var j = 0; j < items.length; j++) {
                            var a = items[j];
                            var date = new Date(a.date);
                            var monthStr = months[date.getMonth()];

                            html += '<a class="sec-card" href="/post.html?id=' + a.id + '">';
                            html += '<div class="sec-card-info">';
                            html += '<span class="sec-card-title">' + a.title + '</span>';
                            html += '<span class="sec-card-meta">' + (a.author || 'Liu Guancheng') + ' · ' + monthStr + ' ' + date.getDate() + ', ' + date.getFullYear() + '</span>';
                            html += '</div>';
                            if (a.description) {
                                html += '<span class="sec-card-desc">' + a.description + '</span>';
                            }
                            html += '</a>';
                        }

                        html += '</div></div>';
                    }

                    container.innerHTML = html;

                    // Reveal groups
                    var groups = container.querySelectorAll('.sec-group');
                    if (skipAnimation) {
                        for (var g = 0; g < groups.length; g++) {
                            groups[g].classList.add('is-revealed');
                        }
                    } else {
                        for (var g = 0; g < groups.length; g++) {
                            (function(el, idx) {
                                setTimeout(function() {
                                    el.classList.add('is-revealed');
                                }, idx * 120);
                            })(groups[g], g);
                        }
                    }

                    // Restore open groups
                    if (restoreOpen) {
                        var openNames = restoreOpen.split('\n');
                        for (var o = 0; o < openNames.length; o++) {
                            var titleEls = container.querySelectorAll('.sec-title');
                            for (var t = 0; t < titleEls.length; t++) {
                                if (titleEls[t].textContent === openNames[o]) {
                                    titleEls[t].closest('.sec-group').classList.add('open');
                                    break;
                                }
                            }
                        }
                    }

                    // Mark visited + restore scroll
                    if (window.sessionStorage) {
                        sessionStorage.setItem('_tag_visited', '1');
                    }
                    if (restoreScroll) {
                        var targetY = parseInt(restoreScroll, 10);
                        requestAnimationFrame(function() {
                            window.scrollTo({ top: targetY, behavior: 'instant' });
                        });
                    }
                })
                .catch(function() {
                    container.innerHTML = '<p style="text-align:center;opacity:0.5;">加载失败。</p>';
                });
        })();
    </script>
</body>
