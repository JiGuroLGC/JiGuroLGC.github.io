<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="Liu Guancheng">
    <title>留言 | JiGuro的个人博客</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/JiGuroLGC/JiGuroLGC.github.io@1.0.0/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/JiGuroLGC/JiGuroLGC.github.io@1.0.0/css/twikoo.css">
    <script src="/js/script.js"></script>
    <meta name="generator" content="Hexo 7.3.0">
</head>

<body>
    <script>
        (() => {
            const currentTheme = window.localStorage && window.localStorage.getItem('theme') || '';
            const isDark = currentTheme === 'dark';
            const pagebody = document.getElementsByTagName('body')[0]
            if (isDark) {
                pagebody.classList.add('dark-theme');
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById("mobile-toggle-theme").innerText = "· 九阴"
            } else {
                pagebody.classList.remove('dark-theme');
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById("mobile-toggle-theme").innerText = "· 重阳"
            }
        })();
    </script>

    <div class="wrapper">
        <header>
            <nav class="navbar">
                <div class="container">
                    <div class="navbar-header header-logo"><a href="/" onclick="sessionStorage&amp;&amp;sessionStorage.setItem('_home_skip','1')">JiGuro&#39;s Blog&nbsp;</a></div>
                    <div class="menu navbar-right">
                        <a class="menu-item" href="/archives">归档</a>
                        <a class="menu-item" href="/category">分类</a>
                        <a class="menu-item" href="/tag">标签</a>
                        <a class="menu-item" href="/message">留言</a>
                        <a class="menu-item" href="/links">友链</a>
                        <a class="menu-item" href="/about">关于</a>
                        <input id="switch_default" type="checkbox" class="switch_default">
                        <label for="switch_default" class="toggleBtn"></label>
                    </div>
                </div>
            </nav>
            <nav class="navbar-mobile" id="nav-mobile">
                <div class="container">
                    <div class="navbar-header">
                        <div>
                            <a href="/" onclick="sessionStorage&amp;&amp;sessionStorage.setItem('_home_skip','1')">JiGuro&#39;s Blog&nbsp;</a><a id="mobile-toggle-theme">·&nbsp;重阳</a>
                        </div>
                        <div class="menu-toggle" onclick="mobileBtn()">&#9776; 留言</div>
                    </div>
                    <div class="menu" id="mobile-menu">
                        <a class="menu-item" href="/archives">归档</a>
                        <a class="menu-item" href="/category">分类</a>
                        <a class="menu-item" href="/tag">标签</a>
                        <a class="menu-item" href="/message">留言</a>
                        <a class="menu-item" href="/links">友链</a>
                        <a class="menu-item" href="/about">关于</a>
                    </div>
                </div>
            </nav>
        </header>
        <script>
            var mobileBtn = function f() {
                var toggleMenu = document.getElementsByClassName("menu-toggle")[0];
                var mobileMenu = document.getElementById("mobile-menu");
                if (toggleMenu.classList.contains("active")) {
                    toggleMenu.classList.remove("active")
                    mobileMenu.classList.remove("active")
                } else {
                    toggleMenu.classList.add("active")
                    mobileMenu.classList.add("active")
                }
            }
        </script>

        <div class="main">
            <div class="post-page">
                <div class="post-page-content" id="message-content">
                    <h1>留言板</h1>
                    <p>欢迎留下你的爪印，畅所欲言。</p>
                </div>
                <div id="tcomment"></div>
            </div>

            <footer id="footer" class="footer">
                <div class="copyright">
                    <span>© 2026 Liu Guancheng | Powered by JiGuro</span>
                </div>
                <a href="https://icp.gov.moe/?keyword=20261961" target="_blank">萌ICP备20261961号</a>
            </footer>
        </div>

        <script>
            (function() {
                var page = document.querySelector('.post-page');
                var content = document.getElementById('message-content');
                if (page) page.classList.add('is-loaded');
                var footer = document.getElementById('footer');
                if (footer) footer.classList.add('is-loaded');
                if (content) {
                    var children = content.children;
                    for (var i = 0; i < children.length; i++) {
                        (function(el, idx) {
                            setTimeout(function() {
                                el.classList.add('is-revealed');
                            }, idx * 100);
                        })(children[i], i);
                    }
                }
            })();
        </script>

        <!-- Twikoo JS -->
        <script src="https://cdn.jsdelivr.net/gh/JiGuroLGC/JiGuroLGC.github.io@1.0.0/js/twikoo.nocss.js"></script>
        <script>
            twikoo.init({
                envId: 'https://twikoolgc.netlify.app/.netlify/functions/twikoo',
                el: '#tcomment',
                path: '/message/',
            })
        </script>
        <script src="/js/twikoo-collapse.js"></script>
</body>

</html>
